name: On-Demand Stock Training

on:
  # --- TEST TRIGGER (Uncomment to debug pipeline on 'test' branch) ---
  # push:
  #   branches:
  #     - test
  
  # --- PRODUCTION TRIGGER (Triggered by your FastAPI app) ---
  repository_dispatch:
    types: [train_model]
    
jobs:
  train:
    runs-on: ubuntu-latest
    container:
      image: tensorflow/tensorflow:2.15.0
      options: --user root

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Remaining Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2.0.0" "pandas<3.0.0" "scikit-learn<1.5.0" \
                                "tf2onnx==1.17.0" "onnx>=1.15.0" "supabase" "requests"

      - name: Run Training, Conversion & Upload
        env:
          # Uses the symbol from the API call, or defaults to AAPL during manual testing
          SYMBOL: ${{ github.event.client_payload.symbol || 'AAPL' }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          APP_ENV: prod
        run: |
          python tools/train_script.py --symbol "$SYMBOL"