name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud's new-code analysis needs full history to diff against
          # the base branch, not just the latest commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint (Prettier)
        run: npm run lint

      - name: Module boundary check
        run: npm run architecture:check

      # No-op until prisma/migrations exists (see backend/docs/migrations.md);
      # after adoption it needs SHADOW_DATABASE_URL, an empty disposable Postgres.
      - name: Migration drift check
        run: npm run db:migrate:check
        env:
          SHADOW_DATABASE_URL: ${{ secrets.SHADOW_DATABASE_URL }}

      - name: Test (excludes live-network Finnhub suite — see test:finnhub)
        run: npm run test:ci

      - name: Dependency audit (fails only on NEW high/critical findings)
        run: npm run audit:check

      - name: Build
        run: npm run build

      # Runs from the repo root (sonar-project.properties lives there) even
      # though this job's other steps default to `backend/` — `uses:` steps
      # aren't affected by `defaults.run.working-directory`. Only evaluates
      # the New Code condition (coverage/duplication/rating on changed lines),
      # not the existing issue backlog — see sonar-project.properties for
      # what's actually scanned.
      #
      # Skipped for PRs from forks, which don't have access to the
      # SONAR_TOKEN secret and would otherwise fail this step outright.
      - name: SonarCloud Scan
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit and component tests (Vitest)
        run: npm test

      - name: Dependency audit (fails only on NEW high/critical findings)
        run: npm run audit:check

  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e
