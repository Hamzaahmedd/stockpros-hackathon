sonar.projectKey=Hamzaahmedd_stockpros-hackathon
sonar.organization=hamzaahmedd

sonar.sources=backend/src
sonar.exclusions=backend/dist/**,backend/node_modules/**,backend/coverage/**
sonar.test.inclusions=backend/src/**/*.test.ts,backend/src/**/*.spec.ts

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Without branch protection (needs a paid GitHub plan on a private repo),
# nothing can force-block a merge — so this is the substitute enforcement
# point: make the scanner itself poll for the Quality Gate result and exit
# non-zero on failure, turning the CI job red as a visible "don't merge"
# signal instead of a silent analysis upload.
sonar.qualitygate.wait=true
